name: Native portability

'on':
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  native-core:
    name: ${{ matrix.platform }} / R ${{ matrix.r }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Linux, os: ubuntu-latest, r: release, build: serial, openmp: forbidden}
          - {platform: macOS, os: macos-latest, r: release, build: serial, openmp: forbidden}
          - {platform: Windows, os: windows-latest, r: release, build: serial, openmp: forbidden}
          - {platform: Linux, os: ubuntu-latest, r: release, build: openmp, openmp: required}
          - {platform: Windows, os: windows-latest, r: release, build: openmp, openmp: required}
    env:
      R_MAKEVARS_USER: ${{ runner.temp }}/Makevars-native
      GEModelR_TEST_LIBRARY: ${{ runner.temp }}/GEModelR-library
      GEModelR_EXPECT_OPENMP: ${{ matrix.openmp }}
      GEModelR_EXPECT_MATRIX_VERSION: installed
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2 (reviewed 2026-10-04)
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2 (reviewed 2026-10-04)
        with:
          packages: deps::.
          cache: false
          install-pandoc: false
          install-quarto: false

      - name: Configure native build
        shell: Rscript --vanilla {0}
        run: |
          expectation = Sys.getenv("GEModelR_EXPECT_OPENMP")
          stopifnot(expectation %in% c("required", "forbidden"))
          # Apple clang stays serial; Linux and Windows use R's OpenMP macro.
          flags = if (identical(expectation, "forbidden")) {
            "SHLIB_OPENMP_CXXFLAGS ="
          } else {
            character()
          }
          writeLines(flags, Sys.getenv("R_MAKEVARS_USER"))
          dir.create(Sys.getenv("GEModelR_TEST_LIBRARY"), recursive = TRUE)
          stopifnot(dir.exists(Sys.getenv("GEModelR_TEST_LIBRARY")))

      - name: Install GEModelR with tests
        shell: bash
        run: R CMD INSTALL --preclean --install-tests --library="$GEModelR_TEST_LIBRARY" .

      - name: Run installed core contracts
        shell: bash
        run: Rscript --vanilla tools/ci/run-installed-core-tests.R
